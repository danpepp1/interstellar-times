<script>
(async function () {
  var msg = document.getElementById('msg');
  // Keep only characters a key can contain: apps that copy a bolded link
  // tack on "**", and some add trailing punctuation or spaces.
  var clean = function (s) { return (s || '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 43); };
  var k = clean(new URLSearchParams(location.search).get('k') || location.hash.slice(1));
  var saved = '';
  try { saved = localStorage.getItem('gz-key') || ''; } catch (e) {}
  if (k.length !== 43) k = saved;
  if (!k) { msg.textContent = 'This paper opens only from the full link in the league chat.'; return; }
  try {
    var b64 = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
    var raw = b64(k.replace(/-/g, '+').replace(/_/g, '/'));
    var data = b64(document.getElementById('edition').textContent);
    var key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: data.slice(0, 12) }, key, data.slice(12));
    // Remember it, so this phone opens the bare address next time too.
    try { localStorage.setItem('gz-key', k); } catch (e) {}
    // Swap the whole document for the decrypted one. document.write left the
    // lock screen's head and body attributes behind, which restyled the paper.
    var doc = new DOMParser().parseFromString(new TextDecoder().decode(plain), 'text/html');
    document.replaceChild(document.adoptNode(doc.documentElement), document.documentElement);
    // Parsed scripts never run on their own; recreate them so they do, in order.
    document.querySelectorAll('script').forEach(function (old) {
      var s = document.createElement('script');
      s.textContent = old.textContent;
      old.replaceWith(s);
    });
    // Links to other pages on the site carry the key, so moving between the
    // home page, editions and the Trade Desk never hits the lock screen.
    document.querySelectorAll('a[href]').forEach(function (a) {
      var h = a.getAttribute('href');
      // No slashes in this test: the loader lives in a template string, which
      // eats backslash escapes, and a broken regex here kills the whole unlock.
      if (!h || h.charAt(0) === '#' || h.indexOf('//') === 0 || /^[a-z][a-z0-9+.-]*:/i.test(h)) return;
      var i = h.indexOf('#');
      var base = i < 0 ? h : h.slice(0, i);
      a.setAttribute('href', base + (base.indexOf('?') < 0 ? '?' : '&') + 'k=' + k + (i < 0 ? '' : h.slice(i)));
    });
  } catch (e) {
    try { localStorage.removeItem('gz-key'); } catch (x) {}
    msg.textContent = 'That link is incomplete. Use the full link from the league chat.';
    if (window.console) console.error('unlock failed', e);
  }
})();
</script>
