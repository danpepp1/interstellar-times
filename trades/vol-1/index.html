<script>
(async function () {
  var msg = document.getElementById('msg');
  var k = new URLSearchParams(location.search).get('k') || location.hash.slice(1);
  if (!k) { msg.textContent = 'This paper opens only from the full link in the league chat.'; return; }
  try {
    var b64 = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
    var raw = b64(k.replace(/-/g, '+').replace(/_/g, '/'));
    var data = b64(document.getElementById('edition').textContent);
    var key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: data.slice(0, 12) }, key, data.slice(12));
    var html = new TextDecoder().decode(plain);
    document.open(); document.write(html); document.close();
  } catch (e) {
    msg.textContent = 'That link is incomplete. Use the full link from the league chat.';
  }
})();
